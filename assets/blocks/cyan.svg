<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>cyan square beveled cube</title>
  <defs>
    <linearGradient id="face" x1="0" y1="13" x2="0" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42CDEB"/>
      <stop offset="1" stop-color="#1996BE"/>
    </linearGradient>
  </defs>
  <!-- Square corners; four 13-unit bevels light the cube from above-left. -->
  <rect width="100" height="100" fill="#085C85"/>
  <path d="M0 0H100L87 13H13Z" fill="#91EFFF"/>
  <path d="M0 0L13 13V87L0 100Z" fill="#55DBF4"/>
  <path d="M100 0V100L87 87V13Z" fill="#127BA6"/>
  <path d="M0 100L13 87H87L100 100Z" fill="#085C85"/>
  <path d="M13 13H87V87H13Z" fill="url(#face)"/>
</svg>
