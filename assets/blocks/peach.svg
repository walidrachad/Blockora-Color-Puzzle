<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>peach square beveled cube</title>
  <defs>
    <linearGradient id="face" x1="0" y1="13" x2="0" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9850"/>
      <stop offset="1" stop-color="#EA692C"/>
    </linearGradient>
  </defs>
  <!-- Square corners; four 13-unit bevels light the cube from above-left. -->
  <rect width="100" height="100" fill="#9B3F1A"/>
