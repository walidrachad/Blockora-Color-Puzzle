  <path d="M0 0L13 13V87L0 100Z" fill="#FFAD63"/>
  <path d="M100 0V100L87 87V13Z" fill="#C45926"/>
  <path d="M0 100L13 87H87L100 100Z" fill="#9B3F1A"/>
  <path d="M13 13H87V87H13Z" fill="url(#face)"/>
</svg>
