  <path d="M0 0L13 13V87L0 100Z" fill="#C892FF"/>
  <path d="M100 0V100L87 87V13Z" fill="#6E3DA1"/>
  <path d="M0 100L13 87H87L100 100Z" fill="#512A7E"/>
  <path d="M13 13H87V87H13Z" fill="url(#face)"/>
