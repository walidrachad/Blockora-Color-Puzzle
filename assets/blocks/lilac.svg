<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>lilac square beveled cube</title>
  <defs>
    <linearGradient id="face" x1="0" y1="13" x2="0" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B67BEF"/>
      <stop offset="1" stop-color="#844CC3"/>
    </linearGradient>
  </defs>
  <!-- Square corners; four 13-unit bevels light the cube from above-left. -->
