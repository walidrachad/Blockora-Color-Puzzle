name: prism_puzzle
description: "Blockora — an original, polished block puzzle game."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  firebase_core: ^4.14.0
  firebase_remote_config: ^6.6.0
  flutter_bloc: ^9.1.1
  audioplayers: ^6.4.0
  google_mobile_ads: ^9.1.0
  lottie: ^3.3.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/audio/
